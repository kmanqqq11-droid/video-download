services:
  - type: web
    name: video-downloader
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 3000
      - key: YTDLP_PATH
        value: yt-dlp
      - key: MAX_CONCURRENT_JOBS
        value: 2
      - key: MAX_DURATION_SECONDS
        value: 3600
      - key: MAX_FILESIZE
        value: 500M
      - key: JOB_TTL_MINUTES
        value: 10
      - key: APP_PIN
        generateValue: false
